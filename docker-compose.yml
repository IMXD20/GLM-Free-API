# GLM Bridge — server deploy + containerized token harvesting.
#
# Usage:
#   1. cp .env.example .env  (or export the vars below) and set AUTH_TOKEN.
#   2. docker compose up -d --build          # starts the api only
#   3. Harvest tokens into the shared volume (headless, no TTY needed):
#        docker compose --profile collect run --rm collector --tokens 850 --batch 5 --parallel 3 --no-tui
#      or interactive with the TUI:
#        docker compose --profile collect run --rm -it collector --tokens 850 --batch 5 --parallel 3
#   4. Point the running api at the fresh file — zero downtime, no restart:
#        curl -X POST http://localhost:3001/sqlite \
#          -H "Authorization: Bearer $AUTH_TOKEN" \
#          -H "Content-Type: application/json" \
#          -d '{"db_path": "/data/tokens.sqlite"}'
#
# The server also starts with an empty /data (guest mode, tokenCount -1);
# captcha-backed requests fail until a token db is provided as above.

services:
  api:
    build: .
    image: zai-api:latest
    container_name: glm-bridge
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      AUTH_TOKEN: ${AUTH_TOKEN:?set AUTH_TOKEN in .env or environment}
      ZAI_TOKEN: ${ZAI_TOKEN:-}
      AGENT_MODE: ${AGENT_MODE:-true}
      AGENT_MODE_VARIANT: ${AGENT_MODE_VARIANT:-modern}
      SESSION_POOL_SIZE: ${SESSION_POOL_SIZE:-5}
      SESSION_REUSE_COUNT: ${SESSION_REUSE_COUNT:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - zai-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Server flags; add e.g. "--sync-mode" or "--agent-mode-level=ultra" here.
    command: ["--db-path=/data/tokens.sqlite"]

  # Token harvester (Dockerfile.collector). Opt-in via profile so plain
  # `up` never starts it; `run` mounts the shared volume and drops
  # ./tokens.sqlite where the api reads it. Chromium needs a large shm.
  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    image: zai-collector:latest
    profiles: ["collect"]
    shm_size: 2gb
    volumes:
      - zai-data:/data
    # Non-interactive defaults; override per run, e.g.:
    #   docker compose --profile collect run --rm collector --tokens 750 --batch 3 --parallel 2 --no-tui
    #   docker compose --profile collect run --rm -it collector --tokens 850 --batch 5   # TUI needs -it
    command: ["--tokens=850", "--batch=5", "--parallel=3", "--no-tui"]

volumes:
  zai-data:
